packages:
  - "apps/*"
  - "packages/*"

catalog:
  zod: ^4.4.3
  i18next: ^26.3.6

  typescript: 5.9.2
  eslint: ^9.39.1
  "@types/node": ^22.15.3

  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": 19.2.2
  "@types/react-dom": 19.2.2

  # Prisma versions are pinned exactly: the CLI, the client runtime and the
  # driver adapter are released in lockstep and must not drift apart.
  prisma: 7.9.0
  "@prisma/client": 7.9.0
  "@prisma/adapter-pg": 7.9.0
  pg: ^8.22.0
  "@types/pg": ^8.20.0

  dotenv: ^17.4.2
  tsx: ^4.23.1
  tsup: ^8.5.1

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  # The Prisma CLI still downloads a schema engine binary on install; without
  # this, `prisma migrate` has nothing to run.
  - "@prisma/engines"
  - prisma
